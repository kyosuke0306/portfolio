<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>井川　恭輔 | ポートフォリオ</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <span class="logo">Portfolio<span class="dot">.</span></span>
    <nav class="site-nav">
      <a href="#hero">TOP</a>
      <a href="#about">プロフィール</a>
      <a href="#works">実績</a>
    </nav>
  </header>

  <main>
    <!-- HERO / ORBITAL SECTION -->
    <section class="hero" id="hero">
      <div class="orbit-stage" id="orbitStage">
        <svg class="orbit-lines" id="orbitLines"></svg>

        <div class="ring-guide"></div>

        <div class="avatar-core" id="avatarCore">
          <div class="avatar-frame" id="avatarFrame">
            <span class="avatar-initials" id="avatarInitials">井恭</span>
          </div>
        </div>

        <div class="orbit-nodes" id="orbitNodes"></div>
      </div>

      <div class="hero-caption">
        <h1 class="profile-name" id="profileName">井川　恭輔</h1>
        <p class="profile-title" id="profileTitle">フロントエンドエンジニア</p>
      </div>

      <div class="hero-legend">
        <span class="legend-item"><i class="legend-dot legend-dot--skills"></i>スキル</span>
        <span class="legend-item"><i class="legend-dot legend-dot--personality"></i>性格</span>
        <span class="legend-item"><i class="legend-dot legend-dot--certs"></i>資格</span>
        <span class="legend-item"><i class="legend-dot legend-dot--career"></i>経歴</span>
      </div>

      <a href="#works" class="scroll-cue" aria-label="実績セクションへスクロール">
        <span></span>
      </a>
    </section>

    <!-- ABOUT / BIO -->
    <section class="about" id="about">
      <h2 class="section-title">プロフィール</h2>
      <p class="bio-text" id="bioText">
        システムエンジニアです。
      </p>

      <div class="about-grid">
        <div class="about-block">
          <h3 class="block-title"><i class="dot legend-dot--skills"></i>スキル</h3>
          <div class="badge-grid" id="skillsGrid"></div>
        </div>
        <div class="about-block">
          <h3 class="block-title"><i class="dot legend-dot--personality"></i>性格</h3>
          <div class="badge-grid" id="personalityGrid"></div>
        </div>
        <div class="about-block">
          <h3 class="block-title"><i class="dot legend-dot--certs"></i>資格</h3>
          <div class="badge-grid" id="certsGrid"></div>
        </div>
      </div>

      <div class="about-block">
        <h3 class="block-title"><i class="dot legend-dot--career"></i>経歴</h3>
        <div class="career-list" id="careerList"></div>
      </div>
    </section>

    <!-- WORKS -->
    <section class="works" id="works">
      <h2 class="section-title">実績</h2>
      <div class="project-grid" id="projectGrid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> <span id="footerName">井川　恭輔</span>. Vanilla HTML / CSS / JS で制作。</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
